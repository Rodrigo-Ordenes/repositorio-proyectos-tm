name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herramientas de las pruebas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 lsof xxd
      - name: Compilar
        run: python3 -m py_compile server.py qr.py
      - name: Pruebas de punta a punta
        run: bash pruebas/ejecutar.sh
      - name: Paleta accesible
        run: python3 herramientas/verificar_paleta.py | tail -1 | grep -q "fallas: 0"
